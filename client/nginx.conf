server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # L'API et les photos passent par le même hôte : pas de CORS, pas de domaine
    # secondaire à configurer côté client. Le préfixe ^~ est indispensable : sans lui,
    # la règle des fichiers statiques ci-dessous, qui est une expression régulière,
    # capterait les photos et répondrait 404.
    location ^~ /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 12m;
    }

    location ^~ /uploads/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    # Les fichiers construits portent une empreinte dans leur nom : ils ne changent jamais.
    location ~* \.(js|css|woff2|webp|png|jpg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Application à page unique : toute autre route retombe sur index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
