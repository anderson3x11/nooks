# La pile de production, telle qu'elle tourne en ligne : une base et une application
# qui sert à la fois l'API et le site. Sert à répéter un déploiement en local.
# Les secrets viennent d'un fichier .env à côté de ce fichier, jamais du dépôt.
#
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nooks}
      POSTGRES_USER: ${POSTGRES_USER:-nooks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?mot de passe de base requis}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-nooks} -d ${POSTGRES_DB:-nooks}']
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${HTTP_PORT:-8080}:8080'
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: >-
        Host=db;Port=5432;Database=${POSTGRES_DB:-nooks};Username=${POSTGRES_USER:-nooks};Password=${POSTGRES_PASSWORD}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?clé de signature requise}
      Jwt__Issuer: ${JWT_ISSUER:-nooks-api}
      Jwt__Audience: ${JWT_AUDIENCE:-nooks-client}
      Moderation__AutoApprove: ${MODERATION_AUTO_APPROVE:-false}
      Nominatim__UserAgent: ${NOMINATIM_USER_AGENT:-Nooks/1.0 (contact@example.com)}

volumes:
  pgdata:
