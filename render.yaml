# Tout le déploiement tient ici. Sur render.com : New, Blueprint, choisir ce dépôt.
# Render lit ce fichier, construit l'image, crée la base et les relie lui-même.
# Rien à recopier à la main, rien à installer sur son poste.

services:
  - name: nooks
    type: web
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      # Render remplit cette variable avec l'adresse de la base créée plus bas.
      - key: ConnectionStrings__Default
        fromDatabase:
          name: nooks-db
          property: connectionString
      # Clé de signature des jetons : tirée au sort par Render, jamais dans le dépôt.
      - key: Jwt__SigningKey
        generateValue: true
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # Le jeu de démonstration n'est inséré que si la base est vide.
      - key: Seed__Demo
        value: 'true'
      # Chaque lieu proposé passe par la file de modération.
      - key: Moderation__AutoApprove
        value: 'false'
      - key: Nominatim__UserAgent
        value: Nooks/1.0 (https://github.com/anderson3x11/nooks)

databases:
  - name: nooks-db
    plan: free
    region: frankfurt
    postgresMajorVersion: '17'
