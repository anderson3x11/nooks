services:
  db:
    image: postgis/postgis:17-3.5
    container_name: nooks-db
    environment:
      POSTGRES_DB: nooks
      POSTGRES_USER: nooks
      POSTGRES_PASSWORD: nooks
    ports:
      - "5433:5432"
    volumes:
      - nooks-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nooks -d nooks"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nooks-pgdata:
